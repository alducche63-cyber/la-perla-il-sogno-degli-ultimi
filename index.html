<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Perla - Il Sogno degli Ultimi</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#e1e1e1;
    text-align:center;
}

header{
    background:#2e7d32;
    color:white;
    padding:20px;
}

#terreno{
    width:1000px;
    max-width:95%;
    height:420px;

    margin:40px auto;

    position:relative;

    background:
    repeating-linear-gradient(
    45deg,
    #5bbf58,
    #5bbf58 10px,
    #63c766 10px,
    #63c766 20px
    );

    border:6px solid #1b5e20;
    border-radius:20px;

    transform:
    perspective(1200px)
    rotateX(15deg);

    box-shadow:
    0 20px 35px rgba(0,0,0,0.35);
}

.paletto{

    width:8px;
    height:22px;

    background:#0f4f1d;

    position:absolute;

    border-radius:2px;
}

.info{
    width:90%;
    max-width:900px;

    margin:auto;

    background:white;

    padding:20px;

    border-radius:12px;

    box-shadow:0 5px 10px rgba(0,0,0,.20);
}

button{

    background:#2e7d32;
    color:white;

    border:none;

    padding:14px 25px;

    border-radius:10px;

    cursor:pointer;

    font-size:18px;
}

button:hover{

    background:#1b5e20;
}

</style>
</head>

<body>

<header>

<h1>🐾 LA PERLA... IL SOGNO DEGLI ULTIMI 🐾</h1>

<p>Costruiamo insieme il rifugio</p>

</header>

<h2>🐶 TERRENO CANI - 12.000 mq</h2>

<div id="terreno"></div>

<div class="info">

<p>
Paletti installati:
<span id="installati">0</span>/200
</p>

<p>
Paletti disponibili da piantare:
<span id="disponibili">90</span>
</p>

<p>
🚪 Cancello non installato
</p>

<button onclick="piantaPaletto()">
🪵 PIANTA UN PALETTO
</button

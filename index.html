<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Perla - Il Sogno degli Ultimi</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#e8e8e8;
    text-align:center;
    margin:0;
}

header{
    background:#2e7d32;
    color:white;
    padding:20px;
}

.terreno{
    width:95%;
    max-width:1100px;
    height:350px;
    margin:30px auto;

    background:
    repeating-linear-gradient(
    45deg,
    #59b85c,
    #59b85c 8px,
    #63c766 8px,
    #63c766 16px
    );

    border:5px solid #1b5e20;
    border-radius:15px;

    position:relative;
}

.paletto{
    width:6px;
    height:20px;
    background:#0d5d25;
    position:absolute;
    top:-10px;
}

.info{
    background:white;
    width:90%;
    max-width:900px;
    margin:auto;
    padding:20px;
    border-radius:10px;
}

button{
    background:#2e7d32;
    border:none;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#1b5e20;
}

</style>
</head>

<body>

<header>

<h1>🐾 LA PERLA... IL SOGNO DEGLI ULTIMI 🐾</h1>

<p>Costruiamo insieme il rifugio</p>

</header>

<h2>🐶 TERRENO CANI</h2>

<div class="terreno" id="terrenoCani"></div>

<div class="info">

<p>
Paletti installati:
<span id="installati">0</span> / 200
</p>

<p>
Paletti disponibili da piantare:
<span id="disponibili">90</span>
</p>

<p>
🚪 Cancello non installato
</p>

<button onclick="piantaPaletto()">
🪵 PIANTA UN PALETTO
</button>

</div>

<script>

let installati = 0;
let disponibili = 90;

function piantaPaletto(){

    if(disponibili <= 0){
        alert("Nessun paletto disponibile");
        return;
    }

    installati++;
    disponibili--;

    document.getElementById("installati").innerText = installati;
    document.getElementById("disponibili").innerText = disponibili;

    let terreno = document.getElementById("terrenoCani");

    let paletto = document.createElement("div");

    paletto.className = "paletto";

    paletto.style.left =
        (installati * 5) + "px";

    terreno.appendChild(paletto);

}

</script>

</body>
</html>

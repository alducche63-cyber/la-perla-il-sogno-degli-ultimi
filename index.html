<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Perla... Il Sogno degli Ultimi</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#e8e8e8;
    text-align:center;
}

header{
    background:#2e7d32;
    color:white;
    padding:25px;
}

.contenitore{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:60px;
    margin-top:40px;
    margin-bottom:50px;
}

.terreno-box{
    width:95%;
    max-width:1100px;
}

.titolo{
    font-size:32px;
    font-weight:bold;
}

.mq{
    font-size:20px;
    color:#444;
    margin-bottom:15px;
}

.terreno{

    width:100%;
    height:420px;

    background:
    repeating-linear-gradient(
       45deg,
       #59b85c,
       #59b85c 12px,
       #63c766 12px,
       #63c766 24px
    );

    border:5px solid #2e7d32;

    border-radius:16px;

    box-shadow:
    0 20px 30px rgba(0,0,0,0.30);

    transform:perspective(1200px) rotateX(15deg);

}

.scala{
    font-size:18px;
    margin-bottom:40px;
}

@media(max-width:800px){

    .titolo{
        font-size:24px;
    }

    .terreno{
        height:280px;
    }

}

</style>
</head>

<body>

<header>

<h1>🐾 LA PERLA... IL SOGNO DEGLI ULTIMI 🐾</h1>

<p>
Costruiamo insieme i rifugi per cani e cavalli
</p>

</header>


<div class="contenitore">

<div class="terreno-box">

<div class="titolo">
🐶 TERRENO CANI
</div>

<div class="mq">
12.000 mq
</div>

<div class="terreno"></div>

</div>


<div class="terreno-box">

<div class="titolo">
🐴 TERRENO CAVALLI
</div>

<div class="mq">
12.000 mq
</div>

<div class="terreno"></div>

</div>

</div>

<div class="scala">

📏 Scala grafica provvisoria

<br><br>

0 m ───────── 10 m ───────── 20 m

</div>

</body>

</html>

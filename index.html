<head>

<title>La Perla... Il Sogno degli Ultimi</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#e8e8e8;
    text-align:center;
}

header{
    background:#2e7d32;
    color:white;
    padding:25px;
}

.contenitore{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:60px;
    margin-top:40px;
    margin-bottom:50px;
}

.terreno-box{
    width:95%;
    max-width:1100px;
}

.titolo{
    font-size:32px;
    font-weight:bold;
}

.mq{
    font-size:20px;
    color:#444;
    margin-bottom:15px;
}

.terreno{
    width:100%;
    height:420px;

    background:
    repeating-linear-gradient(
       45deg,
       #59b85c,
       #59b85c 12px,
       #63c766 12px,
       #63c766 24px
    );

    border:5px solid #2e7d32;
    border-radius:16px;

    box-shadow:
    0 20px 30px rgba(0,0,0,0.30);

    transform:perspective(1200px) rotateX(15deg);
}

.info{
    margin-top:20px;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.barra{
    width:100%;
    background:#ddd;
    height:30px;
    border-radius:20px;
    overflow:hidden;
    margin:15px 0;
}

.riempimento{
    height:100%;
    background:#4caf50;
    color:white;
    font-weight:bold;
    line-height:30px;
}

.pulsante{
    display:inline-block;
    padding:12px 20px;
    margin:8px;
    background:#2e7d32;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.pulsante:hover{
    background:#1f5a24;
}

.stato{
    font-size:18px;
    margin-top:10px;
}

.scala{
    font-size:18px;
    margin-bottom:40px;
}

@media(max-width:800px){

    .titolo{
        font-size:24px;
    }

    .terreno{
        height:280px;
    }

}

</style>
</head>

<body>
